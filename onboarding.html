<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body{
        overflow: hidden;
      }
      .swiper {
        border: 1px solid black;
        width: 300px;
        height: 400px;
        position: relative;
        overflow: hidden;
      }

      .slides {
        display: flex;
        transition: transform 1s ease;
      }

      .slide {
        width: 300px;
        height: 400px;
        flex-shrink: 0;
        background-color: coral;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .indicators{
        display: flex;
        width: 300px;
        justify-content: center;
        gap: 5px;
      }

      .indicator{
        width: 10px;
        height: 10px;
        border: 1px solid black;
        border-radius: 50%;
      }

      .active-indicator{
        background-color: black;
      }

      .buttons {
        width: 300px;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="swiper">
      <div class="slides">
        <div class="slide active-screen">Slide 1</div>
        <div class="slide">Slide 2</div>
        <div class="slide">Slide 3</div>
      </div>
    </div>
    <div class="indicators">
      <div class="indicator active-indicator"></div>
      <div class="indicator"></div>
      <div class="indicator"></div>
    </div>
    <div class="buttons">
      <button id="skip">Skip</button>
      <button id="next">Next</button>
    </div>
    <script src="onboarding.js"></script>
  </body>
</html>

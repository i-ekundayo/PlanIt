<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanIt - Event Management</title>
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>
    <div class="message"></div>
    <div class="container">
      <div class="illustration">
        <!-- Replace with your illustration image -->
        <img src="./images/forgotpass.jpg" alt="Forgot password illustration" />
      </div>

      <section class="container__text">
        <h1>Forgot Password</h1>
        <p>Kindly enter your email address below to recover your account</p>
      </section>

      <div class="form-box" id="form-box">
        <h2>Enter Email Address</h2>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />
        <button class="max" onclick="sendCode()">Send Code</button>
        <p class="link">
          I have remembered my password <a href="planit-signin.html">Sign In</a>
        </p>
      </div>
    </div>

    <script>
      function sendCode() {
        let email = document.getElementById("email").value;
        if (!email) {
          alert("Please enter your email");
          return;
        }
        // alert("Verification code sent to " + email);
      }

      function reloadPage() {
        window.location.reload();
      }

      // Displaying Error
      const errorDisplay = (message) => {
        const newDiv = document.createElement("div");
        newDiv.classList.add("error");
        newDiv.textContent = message;
        errors.appendChild(newDiv);
      };

      // Success Message Display
      const successDisplay = (message) => {
        const newDiv = document.createElement("div");
        newDiv.classList.add("success");
        newDiv.textContent = message;
        messages.appendChild(newDiv);
      };

      // Checking Number of errors
      const errorCheck = (error) => {
        if (Array.isArray(error)) {
          error.forEach((err) => {
            errorDisplay(err.message);
          });
        } else {
          errorDisplay(error);
        }
        setTimeout(() => {
          errors.innerHTML = "";
        }, 5000);
      };

      // SIGN IN
      const sendCodeBtn = document.querySelector(".max");
      const email = document.querySelector("#email");
      const messages = document.querySelector(".message")

        return;

          const response = await fetch(
            "https://planit-production-e550.up.railway.app/api/auth/forgot-password",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                email: email.value,
              }),
            }
          );

          const data = await response.json();

        } catch (error) {

        }
      };

      sendCodeBtn.addEventListener("click", sendcode);
    </script>
  </body>
</html>

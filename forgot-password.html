<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>
    <div class="container">
      <div class="illustration">
        <!-- Replace with your illustration image -->
        <img src="./images/forgotpass.jpg" alt="Forgot password illustration" />
      </div>

      <section class="container__text">
        <h1>Forgot Password</h1>
        <p>Kindly enter your email address below to recover your account</p>
      </section>

      <div class="form-box" id="form-box">
        <h2>Enter Emaill Address</h2>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />
        <button class="max" onclick="sendCode()">Send Code</button>
        <p class="link">
          I have remembered my password <a href="planit-signin.html">Sign In</a>
        </p>
      </div>
    </div>

    <script>
      function sendCode() {
        let email = document.getElementById("email").value;
        if (!email) {
          alert("Please enter your email");
          return;
        }
        alert("Verification code sent to " + email);
      }

      function reloadPage() {
        window.location.reload();
      }
    </script>
  </body>
</html>

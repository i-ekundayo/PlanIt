<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanIt - Event Management</title>
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>
    <div class="message"></div>
    <div class="container">
      <div class="illustration">
        <!-- Replace with your illustration image -->
        <img src="./images/verifypass.png" alt="verify account illustration" />
      </div>

      <section class="container__text">
        <h1>Forgot Password</h1>
        <p>Kindly enter your email address below to recover your account</p>
      </section>

      <div class="form-box" id="form-box">
        <h2>Verify Code</h2>
        <p class="link">Please enter the code sent to your email address</p>

        <div class="code-container">
          <input class="code-input" type="number" maxlength="1" required />
          <input class="code-input" type="number" maxlength="1" required />
          <input class="code-input" type="number" maxlength="1" required />
          <input class="code-input" type="number" maxlength="1" required />
          <input class="code-input" type="number" maxlength="1" required />
          <input class="code-input" type="number" maxlength="1" required />
        </div>

        <button class="max" onclick="verifyCode()">Verify Code</button>

        <button class="resend-code">Resend Code</button>
      </div>
    </div>

    <script>
      const inputs = document.querySelectorAll(".code-input");

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && index > 0 && input.value === "") {
            inputs[index - 1].focus();
          }
        });
      });

      function verifyCode() {
        let code = "";
        inputs.forEach((input) => (code += input.value));

        if (code.length !== 6) {
          alert("Enter 6-digit code");
          return;
        }

        return code;
      }

      // Display Success Message
      const message = sessionStorage.getItem("message");
      const role = localStorage.getItem("role");
      const successMessage = document.querySelector(".message");

      // Success Message Display
      const successDisplay = (message, success = "success") => {
        const newDiv = document.createElement("div");
        console.log(message);

        success === "success"
          ? newDiv.classList.add("success")
          : newDiv.classList.add("error");
        newDiv.textContent = message;
        successMessage.appendChild(newDiv);
        setTimeout(() => {
          successMessage.innerHTML = "";
        }, 5000);
      };

      if (message) {
        successDisplay(message);
        sessionStorage.removeItem("message");
      }

      // Checking Number of errors
      const errorCheck = (error) => {
        if (Array.isArray(error)) {
          error.forEach((err) => {
            successDisplay(err.message, "error");
          });
        } else {
          successDisplay(error, "error");
        }
      };

      // Get the otp and userId
      const userId = localStorage.getItem("userId");
      const verifyCodeBtn = document.querySelector(".max");

      // POST REQUEST TO VERIFY EMAIL
      const verifyEmail = async () => {
        const otp = verifyCode();
        if (!otp) return;
        try {
          const response = await fetch(
            "https://planit-production-e550.up.railway.app/api/auth/verify-email",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                userId: userId,
                otp: otp,
              }),
            }
          );

          console.log(response);
          const data = await response.json();

          if (!response.ok) {
            throw data.errors || data.message;
          }
          console.log(data);

          sessionStorage.setItem("message", data.message);
          localStorage.setItem("token", data.data.accessToken);
          localStorage.setItem("role", data.data.user.role);
          role === "planner"
            ? window.location.replace("planner-profile.html")
            : window.location.replace("vendor-profile.html");
        } catch (error) {
          errorCheck(error);
        }
      };

      // Add event listener to the verify code button
      verifyCodeBtn.addEventListener("click", verifyEmail);

      // POST REQUEST TO RESEND CODE
      const resendCodeBtn = document.querySelector(".resend-code");

      const resendCode = async () => {
        try {
          const response = await fetch(
            "https://planit-production-e550.up.railway.app/api/auth/resend-otp",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                userId: userId,
              }),
            }
          );

          const data = await response.json();

          if (!response.ok) {
            if (data.message.includes("Email is already verified")) {
              successDisplay("Redirecting...");
              setTimeout(() => {
                role === "planner"
                  ? window.location.replace("planner-profile.html")
                  : window.location.replace("vendor-profile.html");
              }, 2000);
              return;
            }

            throw data.errors || data.message;
          }
          console.log(data);
          sessionStorage.setItem("message", data.message);

          if (data.message.includes("Email is already verified")) {
            // setTimeout(() => {
            successDisplay("Redirecting...");
            role === "planner"
              ? window.location.replace("planner-profile.html")
              : window.location.replace("vendor-profile.html");
            // }, 3000);
          }

          window.location.replace("verify-email.html");
        } catch (error) {
          errorCheck(error);
        }
      };

      resendCodeBtn.addEventListener("click", resendCode);
    </script>
  </body>
</html>
